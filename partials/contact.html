<section id="contact" class="contact">
  <div class="section-header">
    <h2 class="section-title">Get In Touch</h2>
    <div class="underline"></div>
  </div>
  <div class="contact-container">
    <div class="contact-info reveal-item">
      <h3 class="contact-subtitle">Contact Information</h3>
      <div class="info-items">
        <div class="info-item">
          <div class="info-icon">
            <i class="fas fa-envelope"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">Email</h4>
            <p class="info-detail">
              <a href="mailto:taimourtariq2003@gmail.com"
                >taimourtariq2003@gmail.com</a
              >
            </p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">Location</h4>
            <p class="info-detail">Sialkot, Pakistan</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <i class="fab fa-github"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">GitHub</h4>
            <p class="info-detail">
              <a
                href="https://github.com/Taimour2003"
                target="_blank"
                rel="noreferrer"
                >github.com/Taimour2003</a
              >
            </p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">
            <i class="fab fa-linkedin-in"></i>
          </div>
          <div class="info-content">
            <h4 class="info-title">LinkedIn</h4>
            <p class="info-detail">
              <a
                href="https://www.linkedin.com/in/taimour-tariq-engineer"
                target="_blank"
                rel="noreferrer"
                >linkedin.com/in/taimour-tariq-engineer</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="contact-form reveal-item">
      <h3 class="contact-subtitle">Send Me a Message</h3>
      <form id="contactForm">
        <div class="form-group">
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Your Name"
            required
          />
          <label for="name">Your Name</label>
        </div>
        <div class="form-group">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Your Email"
            required
          />
          <label for="email">Your Email</label>
        </div>
        <div class="form-group">
          <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Subject"
            required
          />
          <label for="subject">Subject</label>
        </div>
        <div class="form-group">
          <textarea
            id="message"
            name="message"
            placeholder="Your Message"
            required
          ></textarea>
          <label for="message">Your Message</label>
        </div>
        <button type="submit" class="btn primary-btn">Send Message</button>
      </form>
    </div>
  </div>
</section>
